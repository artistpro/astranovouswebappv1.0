<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Astrológica de Alta Precisión · Orrery Edition</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Cormorant+SC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var proto = Object.getPrototypeOf(window) || window;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(proto, 'fetch');
          if (!descriptor || !descriptor.set) {
            var _currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(val) { _currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch patch error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
